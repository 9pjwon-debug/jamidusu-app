<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/iztro@2.6.0/dist/iztro-v2.6.0.min.js"></script>

<style>
  @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.css');

  :root{
    --bg:#070a14;
    --panel:#10162a;
    --panel-alt:#0c1120;
    --gold:#c9a35c;
    --gold-bright:#e8c580;
    --gold-dim:rgba(201,163,92,.35);
    --hairline:rgba(201,163,92,.22);
    --ink:#ece6d8;
    --muted:#8891a8;
    --minor:#6f7690;
    --danger:#d9857a;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    min-height:100%;
    background:var(--bg);
  }
  #ziwei-root{
    font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 700px 400px at 50% -60px, rgba(201,163,92,.12), transparent 65%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:20px 10px 40px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:440px;min-width:0;}

  .orbit{
    display:block;
    width:100%;
    max-width:220px;
    margin:0 auto 6px;
  }
  .hero{
    text-align:center;
    margin-bottom:22px;
  }
  .hero h1{
    font-weight:700;
    font-size:24px;
    margin:0;
    letter-spacing:.5px;
    color:var(--gold-bright);
  }
  .hero p{
    margin:6px 0 0;
    font-size:15.5px;
    color:var(--muted);
  }

  .panel{
    padding:18px 14px;
  }

  .field-label{
    display:block;
    font-size:15.5px;
    color:var(--gold);
    margin:16px 0 7px;
    font-weight:600;
  }
  .field-label:first-child{margin-top:0;}
  input.text-input, select.text-input{
    width:100%;
    min-width:0;
    background:#0a0f1d;
    border:1px solid rgba(201,163,92,.25);
    color:var(--ink);
    font-family:inherit;
    font-size:15.5px;
    padding:11px 10px;
    border-radius:10px;
    outline:none;
  }
  input.text-input:focus, select.text-input:focus{border-color:var(--gold);}
  input.text-input::-webkit-calendar-picker-indicator{filter:invert(.7) sepia(1) saturate(2) hue-rotate(0deg);}

  .pill-toggle{
    display:flex;
    gap:6px;
    background:#0a0f1d;
    padding:4px;
    border-radius:11px;
  }
  .pill-btn{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    padding:9px 6px;
    border-radius:8px;
    cursor:pointer;
  }
  .pill-btn.active{
    background:var(--gold);
    color:#221a0d;
  }

  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;min-width:0;}
  .row3 select{min-width:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:14.5px;
    color:var(--muted);
  }
  .checkbox-row input{width:18px;height:18px;flex:none;accent-color:var(--gold);}

  .form-error{
    color:var(--danger);
    font-size:13.5px;
    min-height:16px;
    margin-top:10px;
    font-weight:600;
  }
  .primary-btn{
    width:100%;
    margin-top:20px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#221a0d;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:16.5px;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(201,163,92,.28);
  }
  .primary-btn:active{transform:scale(.98);}
  .ghost-btn{
    width:100%;
    margin-top:10px;
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(201,163,92,.25);
    font-family:inherit;
    font-weight:600;
    font-size:14.5px;
    padding:11px;
    border-radius:12px;
    cursor:pointer;
  }
  .ghost-btn:hover{color:var(--gold-bright);border-color:var(--gold);}

  /* ---- result screen ---- */
  .summary-card{
    text-align:center;
    margin-bottom:18px;
  }
  .summary-name{
    font-size:21px;
    font-weight:700;
    color:var(--gold-bright);
    margin:0 0 4px;
  }
  .summary-sub{
    font-size:15px;
    color:var(--muted);
    margin:0;
    line-height:1.7;
  }
  .caveat{
    margin-top:12px;
    font-size:12.5px;
    color:var(--danger);
    background:rgba(217,133,122,.08);
    border:1px solid rgba(217,133,122,.25);
    border-radius:9px;
    padding:8px 11px;
  }

  .chart-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,auto);
    gap:4px;
    margin-top:6px;
    min-width:0;
  }
  .palace-cell{
    background:#0a0f1d;
    border:1px solid rgba(201,163,92,.16);
    border-radius:9px;
    padding:6px 4px;
    min-height:100px;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .palace-cell.life{
    border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold-dim), inset 0 0 16px rgba(201,163,92,.08);
  }
  .palace-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .palace-name{
    font-size:13.5px;
    font-weight:700;
    color:var(--gold-bright);
  }
  .palace-branch{
    font-size:11.2px;
    color:var(--minor);
  }
  .palace-major{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-bottom:4px;
  }
  .star-chip{
    font-size:11.8px;
    font-weight:700;
    color:#f4e6c4;
    background:rgba(201,163,92,.14);
    border-radius:5px;
    padding:1.5px 4px;
    white-space:nowrap;
  }
  .star-chip em{
    font-style:normal;
    color:var(--gold);
    font-size:10px;
    margin-left:1px;
  }
  .star-chip.mutagen{background:rgba(217,133,122,.18); color:#f0b3a8;}
  .palace-minor{
    font-size:10.6px;
    color:var(--minor);
    line-height:1.5;
    word-break:keep-all;
  }
  .center-panel{
    grid-row:2 / 4;
    grid-column:2 / 4;
    min-width:0;
    background:radial-gradient(ellipse at 50% 20%, rgba(201,163,92,.10), transparent 70%), #0a0f1d;
    border:1px solid rgba(201,163,92,.2);
    border-radius:9px;
    padding:10px 6px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    gap:2px;
  }
  .center-panel .c-name{
    font-size:15.5px;
    font-weight:700;
    color:var(--gold-bright);
    margin:0 0 2px;
  }
  .center-panel .c-line{
    font-size:11.2px;
    color:var(--muted);
    margin:0;
  }
  .center-mini-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px 6px;
    margin-top:6px;
    text-align:left;
  }
  .center-mini-grid div{
    font-size:10.6px;
    color:var(--minor);
  }
  .center-mini-grid span{
    color:var(--gold);
    font-weight:700;
    margin-right:2px;
  }

  .reading-section{
    margin-top:22px;
  }
  .reading-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--gold-bright);
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .reading-title::before{
    content:'✦';
    color:var(--gold);
    font-size:13px;
  }
  .reading-rule{
    height:1px;
    background:linear-gradient(90deg, var(--gold-dim), transparent);
    margin-bottom:12px;
  }
  .accordion-body-inner p, .qa-a p{
    font-size:15px;
    line-height:1.85;
    color:var(--ink);
    margin:0 0 12px;
  }
  .accordion-body-inner p:last-child, .qa-a p:last-child{margin-bottom:0;}
  .accordion-body-inner strong, .qa-a strong{
    color:var(--gold-bright);
    font-weight:700;
  }
  .accordion-list{margin-top:2px;}
  .accordion-item{
    border-bottom:1px solid rgba(201,163,92,.16);
  }
  .accordion-item:last-child{border-bottom:none;}
  .accordion-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:transparent;
    border:none;
    padding:13px 2px;
    cursor:pointer;
    text-align:left;
  }
  .accordion-title{
    font-size:15px;
    font-weight:700;
    color:var(--gold-bright);
  }
  .accordion-item.expanded .accordion-title{color:var(--ink);}
  .accordion-chevron{
    font-size:16px;
    font-weight:700;
    color:var(--gold);
    flex:none;
  }
  .accordion-body{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .35s ease, opacity .3s ease;
  }
  .accordion-item.expanded .accordion-body{
    max-height:5000px;
    opacity:1;
  }
  .accordion-body-inner{
    padding:0 2px 16px;
  }
  .reading-loading{
    font-size:14px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .spin{
    width:13px;height:13px;
    border-radius:50%;
    border:2px solid var(--gold-dim);
    border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .reading-error{
    font-size:14px;
    color:var(--danger);
  }

  .result-actions{
    display:flex;
    gap:8px;
    margin-top:22px;
  }
  .result-actions button{flex:1;}

  .qa-pair{
    margin-bottom:14px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(201,163,92,.12);
  }
  .qa-pair:last-of-type{border-bottom:none;}
  .qa-q{
    font-size:14.5px;
    font-weight:700;
    color:var(--gold-bright);
    margin:0 0 5px;
  }
  .qa-q::before{content:'Q. ';color:var(--gold);}
  .qa-a{
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink);
    margin:0;
  }
  .qa-a.qa-error{color:var(--danger);}
  .qa-a.qa-loading{
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .followup-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .followup-row .text-input{flex:1;}
  .followup-btn{
    width:auto;
    flex:none;
    margin-top:0;
    padding:0 18px;
    white-space:nowrap;
  }
  .followup-row .text-input:disabled, .followup-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
</style>

<div id="ziwei-root">
  <div class="wrap">
    <div class="hero">
      <svg class="orbit" viewBox="0 0 220 130" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="110" cy="65" rx="100" ry="46" fill="none" stroke="#c9a35c" stroke-opacity="0.35" stroke-width="0.8"/>
        <ellipse cx="110" cy="65" rx="70" ry="30" fill="none" stroke="#c9a35c" stroke-opacity="0.28" stroke-width="0.8"/>
        <ellipse cx="110" cy="65" rx="40" ry="16" fill="none" stroke="#c9a35c" stroke-opacity="0.22" stroke-width="0.8"/>
        <circle cx="110" cy="65" r="4.5" fill="#e8c580"/>
        <circle cx="10" cy="65" r="1.6" fill="#e8c580" opacity="0.8"/>
        <circle cx="180" cy="35" r="1.3" fill="#e8c580" opacity="0.7"/>
        <circle cx="40" cy="20" r="1" fill="#e8c580" opacity="0.6"/>
        <circle cx="200" cy="90" r="1.4" fill="#e8c580" opacity="0.65"/>
      </svg>
      <h1>지원 친구들의 자미두수</h1>
      <p>별의 자리로 읽는 나의 명반</p>
    </div>
    <div id="app" class="panel"></div>
  </div>
</div>

<script>
(function(){
  const BRANCH_HANJA = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const BRANCH_HANGUL = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
  const TIME_LABELS = [
    '자시 (23:00~01:00)', '축시 (01:00~03:00)', '인시 (03:00~05:00)', '묘시 (05:00~07:00)',
    '진시 (07:00~09:00)', '사시 (09:00~11:00)', '오시 (11:00~13:00)', '미시 (13:00~15:00)',
    '신시 (15:00~17:00)', '유시 (17:00~19:00)', '술시 (19:00~21:00)', '해시 (21:00~23:00)'
  ];
  // [row, col] on a 4x4 grid for each earthly-branch index (0=子...11=亥)
  const BRANCH_GRID_POS = [
    [3,2],[3,1],[3,0],[2,0],[1,0],[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[3,3]
  ];

  const SECTIONS = [
    { id:'overview', icon:'🔮', title:'전체 사주 총평', points:['타고난 기질','강점/약점','인생의 큰 흐름','사주에서 가장 두드러지는 특징','이 사주는 어떤 사람인가'] },
    { id:'personality', icon:'🧠', title:'성격 & 성향', points:['기본 성격','인간관계 스타일','감정 표현 방식','스트레스 받을 때 나타나는 모습','타인에게 어떻게 보이는지'] },
    { id:'career', icon:'💼', title:'직업 & 커리어', points:['어떤 직업이 잘 맞는지','조직생활 vs 독립','직장운','승진/성공운','이직운','사업운','돈을 버는 방식'] },
    { id:'wealth', icon:'💰', title:'재물운', points:['돈을 벌 수 있는 구조','재산을 모으는 타입인지/쓰는 타입인지','투자운','큰돈이 들어오는 시기','재물운이 좋아지는 나이','조심해야 하는 시기'] },
    { id:'love', icon:'❤️', title:'연애 & 결혼', points:['연애 스타일','어떤 사람에게 끌리는지','잘 맞는 배우자 유형','결혼운','배우자복','연애에서 반복되는 패턴','결혼하기 좋은 시기'] },
    { id:'relationships', icon:'👥', title:'인간관계', points:['친구운','직장 내 인간관계','귀인운','나와 충돌하기 쉬운 사람','어떤 사람을 가까이해야 하는지'] },
    { id:'decadal', icon:'📈', title:'대운 — 인생의 큰 흐름', points:['10년 단위 운','20대/30대/40대…','커리어가 올라가는 시기','돈이 크게 움직이는 시기','인생의 전환점'] },
    { id:'thisyear', icon:'📅', title:'올해 운세', points:['올해 전체 흐름','커리어','재물','연애','인간관계','조심해야 할 것'] },
    { id:'monthly', icon:'📆', title:'월별 운세', points:['1~12월','좋은 달','중요한 변화가 있는 달','조심해야 할 달','이직/투자/연애 등에 좋은 시기'] },
    { id:'forecast', icon:'✨', title:'앞으로 3~5년 전망', points:['언제 커리어가 크게 변하는지','언제 돈이 좋아지는지','연애/결혼 가능성이 높은 시기','큰 전환점'] }
  ];

  const state = {
    screen: 'start',   // 'start' | 'result'
    name: '',
    gender: '남',
    calType: 'solar',  // 'solar' | 'lunar'
    dateYear: new Date().getFullYear(),
    dateMonth: 1,
    dateDay: 1,
    isLeapMonth: false,
    timeIndex: 6,
    timeUnknown: false,
    astrolabe: null,
    readingSections: null,   // { overview: '...', personality: '...', ... }
    expandedSections: {},    // { overview: true, ... }
    readingLoading: false,
    readingError: false,
    followUps: [],       // [{question, answer, error}]
    followUpLoading: false
  };

  // ---------------- usage limits (per-browser, simple abuse guard) ----------------
  const USAGE_KEY_READING = 'zwds_reading_used_v1';
  const USAGE_KEY_FOLLOWUP = 'zwds_followup_used_v1';

  function hasUsedReading(){
    try{ return localStorage.getItem(USAGE_KEY_READING) === '1'; }catch(e){ return false; }
  }
  function markReadingUsed(){
    try{ localStorage.setItem(USAGE_KEY_READING, '1'); }catch(e){}
  }
  function hasUsedFollowup(){
    try{ return localStorage.getItem(USAGE_KEY_FOLLOWUP) === '1'; }catch(e){ return false; }
  }
  function markFollowupUsed(){
    try{ localStorage.setItem(USAGE_KEY_FOLLOWUP, '1'); }catch(e){}
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function formatBody(text){
    if(!text) return '';
    return text.split(/\n\n+/).map(para => {
      let escaped = escapeHtml(para);
      escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/\n/g, '<br>');
      return `<p>${escaped}</p>`;
    }).join('');
  }

  function branchIndex(str){
    let i = BRANCH_HANJA.indexOf(str);
    if(i === -1) i = BRANCH_HANGUL.indexOf(str);
    return i;
  }

  function yearOptions(selected){
    const now = new Date().getFullYear();
    let opts = '';
    for(let y = now; y >= 1930; y--){
      opts += `<option value="${y}" ${String(y) === String(selected) ? 'selected' : ''}>${y}</option>`;
    }
    return opts;
  }
  function monthOptions(selected){
    let opts = '';
    for(let m = 1; m <= 12; m++) opts += `<option value="${m}" ${String(m) === String(selected) ? 'selected' : ''}>${m}월</option>`;
    return opts;
  }
  function dayOptions(selected, maxDay){
    const max = maxDay || 31;
    let opts = '';
    for(let d = 1; d <= max; d++) opts += `<option value="${d}" ${String(d) === String(selected) ? 'selected' : ''}>${d}일</option>`;
    return opts;
  }
  function timeOptions(selected){
    let opts = TIME_LABELS.map((label, i) => `<option value="${i}" ${String(i) === String(selected) ? 'selected' : ''}>${label}</option>`).join('');
    opts += `<option value="unknown" ${selected === 'unknown' ? 'selected' : ''}>태어난 시간을 몰라요</option>`;
    return opts;
  }

  // ---------------- chart calculation ----------------
  function computeAstrolabe(){
    const gender = state.gender; // '남' | '여'
    const timeIndex = state.timeUnknown ? 6 : state.timeIndex;
    const y = document.getElementById('dateYear').value;
    const m = document.getElementById('dateMonth').value;
    const d = document.getElementById('dateDay').value;
    const dateStr = `${y}-${m}-${d}`;

    if(state.calType === 'solar'){
      return iztro.astro.bySolar(dateStr, timeIndex, gender, true, 'ko-KR');
    } else {
      return iztro.astro.byLunar(dateStr, timeIndex, gender, state.isLeapMonth, true, 'ko-KR');
    }
  }

  // ---------------- AI reading ----------------
  function astrolabeSummaryText(a){
    const palaceLines = a.palaces.map(p => {
      const majors = p.majorStars.map(s => s.name + (s.brightness ? `(${s.brightness})` : '')).join(', ') || '없음';
      return `- ${p.name}(${p.heavenlyStem}${p.earthlyBranch}): 주성 ${majors}`;
    }).join('\n');

    return `[이름] ${state.name} (${state.gender})
[생년월일] 양력 ${a.solarDate} / 음력 ${a.lunarDate}
[사주] ${a.chineseDate}
[별자리] ${a.sign} / [띠] ${a.zodiac}
[명주] ${a.soul} / [신주] ${a.body} / [오행국] ${a.fiveElementsClass}

[12궁 배치]
${palaceLines}`;
  }

  function buildFullPrompt(a){
    const todayStr = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    const sectionGuide = SECTIONS.map(s => `- "${s.id}" (${s.title}): ${s.points.join(', ')}`).join('\n');
    const schemaLines = SECTIONS.map(s => `  "${s.id}": "..."`).join(',\n');

    return `당신은 자미두수(紫微斗數)에 능숙하고 친근한 한국어 사주 상담가입니다. 아래 명반 정보를 참고해서 이 사람을 위한 아주 상세한 사주풀이를 작성해주세요.

오늘 날짜: ${todayStr}

${astrolabeSummaryText(a)}

다음 10개 섹션 각각에 대해 풍부한 내용을 작성해주세요. 각 섹션은 2~4개 문단 분량으로, 아래 나열된 내용을 자연스러운 문장 속에 녹여서 설명해주세요 (항목을 단순 나열하지 말고 이야기처럼 풀어서 설명해주세요).

${sectionGuide}

작성 규칙:
- 각 섹션 본문에서 가장 중요하고 핵심적인 문구나 결론은 **볼드**(별표 두 개로 감싸기)로 강조해서 한눈에 들어오게 해주세요. 섹션당 3~6개 정도의 볼드 강조가 적당해요.
- 명반(12궁, 주성, 사화 등)에 근거한 구체적인 내용으로 작성하되, 전문 용어는 풀어서 설명해주세요.
- "decadal", "thisyear", "monthly", "forecast" 섹션은 위에 적힌 오늘 날짜를 기준으로 실제 나이·연도·월을 구체적으로 언급하며 작성해주세요.
- 각 섹션 내에서 문단 사이는 빈 줄(\\n\\n)로 구분해주세요.
- 마크다운 문법은 **볼드**만 사용하고, #, -, * 목록 등 다른 마크다운은 사용하지 마세요.

반드시 아래와 같은 형식의 순수 JSON 객체만 출력하세요. JSON 앞뒤로 어떠한 설명, 인사말, 코드블록 표시(\`\`\`)도 절대 포함하지 마세요.

{
${schemaLines}
}`;
  }

  function flattenSections(sections){
    if(!sections) return '';
    return SECTIONS.map(s => `[${s.title}]\n${sections[s.id] || ''}`).join('\n\n');
  }

  function buildShareText(){
    const a = state.astrolabe;
    const header = `[${state.name}님의 자미두수]\n${a.sign} · ${a.zodiac}띠 · ${a.fiveElementsClass}\n\n`;
    const body = flattenSections(state.readingSections).replace(/\*\*/g, '');
    return header + body;
  }

  async function shareResult(){
    const text = buildShareText();
    if(navigator.share){
      try{
        await navigator.share({ title: `${state.name}님의 자미두수`, text });
      }catch(e){
        // user cancelled the share sheet - nothing to do
      }
      return;
    }
    try{
      await navigator.clipboard.writeText(text);
      alert('결과가 클립보드에 복사됐어요. 카카오톡 등에 붙여넣기 해주세요!');
    }catch(e){
      window.prompt('아래 내용을 복사해서 카카오톡 등에 붙여넣어 주세요:', text);
    }
  }

  function buildFollowUpPrompt(a, priorReadingText, history, question){
    const historyText = history.map(h => `Q: ${h.question}\nA: ${h.answer}`).join('\n\n');
    return `당신은 자미두수(紫微斗數)에 능숙하고 친근한 한국어 사주 상담가입니다. 아래는 한 사람의 명반 정보와 앞서 전달한 사주풀이, 그리고 지금까지 나눈 추가 질문들입니다. 마지막 질문에 명반 내용에 근거해서 친근하고 간결하게(2~4문장) 한국어로 답해주세요. 핵심 문구는 **볼드**로 강조해도 좋습니다. 그 외 마크다운 문법(#, -, * 등)은 사용하지 마세요.

${astrolabeSummaryText(a)}

[앞서 전달한 사주풀이]
${priorReadingText}

[지금까지 나눈 추가 질문]
${historyText || '(아직 없음)'}

[새 질문]
${question}`;
  }

  async function callAI(prompt, maxTokens){
    const response = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt,
        maxTokens: maxTokens || 1000
      })
    });
    if(!response.ok) throw new Error('API request failed: ' + response.status);
    const data = await response.json();
    if(!data.text) throw new Error('empty response');
    return data.text;
  }

  async function fetchReadingSections(astrolabe){
    const prompt = buildFullPrompt(astrolabe);
    const raw = await callAI(prompt, 8000);
    const cleaned = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    const parsed = JSON.parse(cleaned);
    return parsed;
  }

  async function runReading(astrolabe){
    state.readingSections = null;
    state.readingLoading = true;
    state.readingError = false;
    state.followUps = [];
    state.expandedSections = {};
    render();
    try{
      const sections = await fetchReadingSections(astrolabe);
      state.readingSections = sections;
      state.expandedSections = { overview: true };
      state.readingLoading = false;
    }catch(e){
      console.error('reading generation failed', e);
      state.readingLoading = false;
      state.readingError = true;
    }
    render();
  }

  function handleFollowUpSubmit(){
    if(state.followUpLoading || hasUsedFollowup()) return;
    const input = document.getElementById('followUpInput');
    const question = (input && input.value || '').trim().slice(0, 200);
    if(!question) return;
    input.value = '';
    markFollowupUsed();
    const entry = { question, answer: null, error: false };
    const priorHistory = state.followUps.slice();
    state.followUps.push(entry);
    state.followUpLoading = true;
    render();

    const prompt = buildFollowUpPrompt(state.astrolabe, flattenSections(state.readingSections), priorHistory, question);
    callAI(prompt, 3000).then(text => {
      entry.answer = text;
    }).catch(e => {
      console.error('follow-up failed', e);
      entry.error = true;
    }).finally(() => {
      state.followUpLoading = false;
      render();
    });
  }

  // ---------------- flow ----------------
  async function handleSubmit(){
    const errEl = document.getElementById('formError');
    if(hasUsedReading()){
      if(errEl) errEl.textContent = '죄송해요, 체험은 1인당 1회만 가능해요.';
      return;
    }
    const nameInput = document.getElementById('nameInput');
    const name = (nameInput && nameInput.value || '').trim().slice(0, 12);
    if(!name){
      if(errEl) errEl.textContent = '이름을 입력해주세요.';
      return;
    }
    state.name = name;

    let astrolabe;
    try{
      astrolabe = computeAstrolabe();
    }catch(e){
      if(errEl) errEl.textContent = '날짜를 다시 확인해주세요.';
      return;
    }

    markReadingUsed();
    state.astrolabe = astrolabe;
    state.screen = 'result';
    render();
    runReading(astrolabe);
  }

  function goHome(){
    state.screen = 'start';
    state.astrolabe = null;
    state.readingSections = null;
    state.expandedSections = {};
    state.readingLoading = false;
    state.readingError = false;
    state.followUps = [];
    state.followUpLoading = false;
    render();
  }

  // ---------------- rendering ----------------
  function renderStartHTML(){
    const isSolar = state.calType === 'solar';
    const limitReached = hasUsedReading();
    if(limitReached){
      return `
        <p class="summary-sub" style="text-align:center">이 브라우저에서는 이미 체험을 사용하셨어요.<br>체험은 1인당 1회로 제한하고 있어요. 양해 부탁드려요 🙏</p>
      `;
    }
    return `
      <label class="field-label">이름</label>
      <input id="nameInput" class="text-input" maxlength="12" placeholder="이름을 입력해주세요" value="${escapeHtml(state.name)}">

      <label class="field-label">성별</label>
      <div class="pill-toggle">
        <button class="pill-btn ${state.gender === '남' ? 'active' : ''}" data-action="set-gender" data-gender="남">남</button>
        <button class="pill-btn ${state.gender === '여' ? 'active' : ''}" data-action="set-gender" data-gender="여">여</button>
      </div>

      <label class="field-label">생년월일</label>
      <div class="row3">
        <select id="dateYear" class="text-input">${yearOptions(state.dateYear)}</select>
        <select id="dateMonth" class="text-input">${monthOptions(state.dateMonth)}</select>
        <select id="dateDay" class="text-input">${dayOptions(state.dateDay, isSolar ? 31 : 30)}</select>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="calTypeCheck" ${!isSolar ? 'checked' : ''}>
        <label for="calTypeCheck">음력으로 입력할게요</label>
      </div>
      ${!isSolar ? `
        <div class="checkbox-row">
          <input type="checkbox" id="leapCheck" ${state.isLeapMonth ? 'checked' : ''}>
          <label for="leapCheck">윤달에 태어났어요</label>
        </div>
      ` : ''}

      <label class="field-label">태어난 시간</label>
      <select id="timeSelect" class="text-input">${timeOptions(state.timeUnknown ? 'unknown' : state.timeIndex)}</select>

      <div id="formError" class="form-error"></div>
      <button class="primary-btn" data-action="submit">자미두수 명반 보기</button>
    `;
  }

  function starChip(star){
    const hasMutagen = star.mutagen && star.mutagen.length > 0;
    return `<span class="star-chip ${hasMutagen ? 'mutagen' : ''}">${escapeHtml(star.name)}${star.brightness ? `<em>${escapeHtml(star.brightness)}</em>` : ''}${hasMutagen ? `<em>${escapeHtml(star.mutagen)}</em>` : ''}</span>`;
  }

  function renderChartGrid(a){
    let cells = '';
    a.palaces.forEach(p => {
      const bi = branchIndex(p.earthlyBranch);
      const pos = BRANCH_GRID_POS[bi] || [0,0];
      const isLife = p.name && p.name.indexOf('명') === 0;
      const minorText = [...(p.minorStars||[]), ...(p.adjectiveStars||[])].map(s => s.name).join(' · ');
      cells += `
        <div class="palace-cell ${isLife ? 'life' : ''}" style="grid-row:${pos[0]+1};grid-column:${pos[1]+1}">
          <div class="palace-top">
            <span class="palace-name">${escapeHtml(p.name)}</span>
            <span class="palace-branch">${escapeHtml(p.heavenlyStem)}${escapeHtml(p.earthlyBranch)}</span>
          </div>
          <div class="palace-major">${(p.majorStars||[]).map(starChip).join('')}</div>
          <div class="palace-minor">${escapeHtml(minorText)}</div>
        </div>
      `;
    });

    const solarTag = state.calType === 'solar' ? ' · 입력 기준' : '';
    const lunarTag = state.calType === 'lunar' ? ' · 입력 기준' : '';
    const center = `
      <div class="center-panel">
        <p class="c-name">${escapeHtml(state.name)} · ${escapeHtml(state.gender)}</p>
        <p class="c-line">양력 ${escapeHtml(a.solarDate)}${solarTag}</p>
        <p class="c-line">음력 ${escapeHtml(a.lunarDate)}${lunarTag}</p>
        <div class="center-mini-grid">
          <div><span>사주</span>${escapeHtml(a.chineseDate)}</div>
          <div><span>별자리</span>${escapeHtml(a.sign)}</div>
          <div><span>띠</span>${escapeHtml(a.zodiac)}</div>
          <div><span>명주</span>${escapeHtml(a.soul)}</div>
          <div><span>신주</span>${escapeHtml(a.body)}</div>
          <div><span>오행국</span>${escapeHtml(a.fiveElementsClass)}</div>
        </div>
      </div>
    `;

    return `<div class="chart-grid">${cells}${center}</div>`;
  }

  function renderAccordion(){
    return SECTIONS.map(s => {
      const expanded = !!state.expandedSections[s.id];
      const bodyText = (state.readingSections && state.readingSections[s.id]) || '';
      return `
        <div class="accordion-item ${expanded ? 'expanded' : ''}">
          <button class="accordion-header" data-action="toggle-section" data-section-id="${s.id}">
            <span class="accordion-title">${s.icon} ${escapeHtml(s.title)}</span>
            <span class="accordion-chevron">${expanded ? '−' : '+'}</span>
          </button>
          <div class="accordion-body">
            <div class="accordion-body-inner">${formatBody(bodyText)}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderFollowUpSection(){
    if(!state.readingSections) return '';
    const qaHtml = state.followUps.map(f => {
      let answerHtml;
      if(f.answer){
        answerHtml = `<div class="qa-a">${formatBody(f.answer)}</div>`;
      } else if(f.error){
        answerHtml = `<p class="qa-a qa-error">답변 생성에 실패했어요.</p>`;
      } else {
        answerHtml = `<p class="qa-a qa-loading"><span class="spin"></span>생각 중…</p>`;
      }
      return `<div class="qa-pair"><p class="qa-q">${escapeHtml(f.question)}</p>${answerHtml}</div>`;
    }).join('');

    const followupInputRow = hasUsedFollowup()
      ? `<p class="summary-sub" style="margin-top:10px">추가 질문은 1회만 가능해요. 이미 사용하셨어요.</p>`
      : `
        <div class="followup-row">
          <input id="followUpInput" class="text-input" placeholder="예: 올해 연애운은 어때요?" maxlength="200" ${state.followUpLoading ? 'disabled' : ''}>
          <button class="primary-btn followup-btn" data-action="ask-followup" ${state.followUpLoading ? 'disabled' : ''}>질문하기</button>
        </div>
      `;

    return `
      <div class="reading-section">
        <p class="reading-title">더 궁금한 점이 있나요?</p>
        <div class="reading-rule"></div>
        ${qaHtml}
        ${followupInputRow}
      </div>
    `;
  }

  function renderResultHTML(){
    const a = state.astrolabe;
    let readingBlock;
    if(state.readingLoading){
      readingBlock = `<div class="reading-loading"><span class="spin"></span>AI가 열 가지 항목으로 명반을 자세히 해석하고 있어요… (조금 걸릴 수 있어요)</div>`;
    } else if(state.readingError){
      readingBlock = `<div class="reading-error">해석 생성에 실패했어요. 위 명반 정보는 그대로 확인하실 수 있어요.</div><button class="ghost-btn" style="margin-top:10px" data-action="retry-reading">해석 다시 시도</button>`;
    } else if(state.readingSections){
      readingBlock = `<div class="accordion-list">${renderAccordion()}</div>`;
    } else {
      readingBlock = '';
    }

    return `
      <div class="summary-card">
        <p class="summary-name">${escapeHtml(state.name)}님의 명반</p>
        <p class="summary-sub">${escapeHtml(a.sign)} · ${escapeHtml(a.zodiac)}띠 · ${escapeHtml(a.fiveElementsClass)}</p>
        ${state.timeUnknown ? `<div class="caveat">태어난 시간을 정확히 몰라 대략적으로 계산했어요. 시간을 알게 되면 더 정확한 명반을 볼 수 있어요.</div>` : ''}
      </div>
      ${renderChartGrid(a)}
      <div class="reading-section">
        <p class="reading-title">AI가 풀어주는 자미두수</p>
        <div class="reading-rule"></div>
        ${readingBlock}
      </div>
      ${renderFollowUpSection()}
      <div class="result-actions">
        ${state.readingSections ? `<button class="ghost-btn" data-action="share-result">카카오톡으로 내보내기</button>` : ''}
        <button class="ghost-btn" data-action="go-home">다른 사람 보기</button>
      </div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    if(state.screen === 'start') app.innerHTML = renderStartHTML();
    else app.innerHTML = renderResultHTML();
  }

  function handleClick(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    if(action === 'set-gender'){
      state.gender = btn.dataset.gender;
      render();
    } else if(action === 'toggle-section'){
      const id = btn.dataset.sectionId;
      state.expandedSections[id] = !state.expandedSections[id];
      render();
    } else if(action === 'submit'){
      state.timeUnknown = document.getElementById('timeSelect').value === 'unknown';
      if(!state.timeUnknown) state.timeIndex = parseInt(document.getElementById('timeSelect').value, 10);
      if(state.calType === 'lunar'){
        const leapEl = document.getElementById('leapCheck');
        state.isLeapMonth = !!(leapEl && leapEl.checked);
      }
      handleSubmit();
    } else if(action === 'go-home'){
      goHome();
    } else if(action === 'retry-reading'){
      runReading(state.astrolabe);
    } else if(action === 'ask-followup'){
      handleFollowUpSubmit();
    } else if(action === 'share-result'){
      shareResult();
    }
  }

  function handleKeydown(e){
    if(e.key === 'Enter' && e.target && e.target.id === 'followUpInput'){
      e.preventDefault();
      handleFollowUpSubmit();
    }
  }

  // Keep state in sync with in-progress form input so an unrelated
  // render() (e.g. toggling gender) doesn't wipe out what's already typed.
  function handleFormInput(e){
    const t = e.target;
    if(!t || !t.id) return;
    if(t.id === 'nameInput') state.name = t.value;
    else if(t.id === 'dateYear') state.dateYear = t.value;
    else if(t.id === 'dateMonth') state.dateMonth = t.value;
    else if(t.id === 'dateDay') state.dateDay = t.value;
    else if(t.id === 'leapCheck') state.isLeapMonth = t.checked;
    else if(t.id === 'timeSelect'){
      state.timeUnknown = t.value === 'unknown';
      if(!state.timeUnknown) state.timeIndex = parseInt(t.value, 10);
    } else if(t.id === 'calTypeCheck'){
      state.calType = t.checked ? 'lunar' : 'solar';
      if(state.calType === 'lunar' && parseInt(state.dateDay, 10) > 30) state.dateDay = 30;
      render();
    }
  }

  document.getElementById('app').addEventListener('click', handleClick);
  document.getElementById('app').addEventListener('keydown', handleKeydown);
  document.getElementById('app').addEventListener('input', handleFormInput);
  document.getElementById('app').addEventListener('change', handleFormInput);
  render();
})();
</script>
