# XcodeGen 스펙 (선택 사항).
# TodayChinese.xcodeproj 는 이미 커밋되어 있으므로 그냥 열면 된다.
# 프로젝트 파일이 꼬였을 때 `xcodegen generate` 로 다시 만들 수 있다.
name: TodayChinese
options:
  bundleIdPrefix: com.jamidusu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TodayChinese:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: TodayChinese
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamidusu.todaychinese
        INFOPLIST_FILE: TodayChinese/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodayChinese/TodayChinese.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: TodayChineseWidgetExtension
        embed: true

  TodayChineseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: TodayChineseWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamidusu.todaychinese.widget
        INFOPLIST_FILE: TodayChineseWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodayChineseWidget/TodayChineseWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
